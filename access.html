<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>验证中</title>
</head>
<body>
    <div id="msg">正在验证...</div>
    <script>
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        if (!code) {
            document.getElementById('msg').innerText = '缺少卡密';
        } else {
            fetch('https://api.findyourself.cc/api/validate?code=' + code)
                .then(r => r.json())
                .then(data => {
                    if (data.link) {
                        location.href = data.link;
                    } else {
                        document.getElementById('msg').innerText = data.error || '未知错误';
                    }
                })
                .catch(e => {
                    document.getElementById('msg').innerText = '请求失败: ' + e.message;
                });
        }
    </script>
</body>
</html>
